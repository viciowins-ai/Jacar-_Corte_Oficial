<!doctype html>
<html lang="pt-BR">

<head>
  <meta charset="UTF-8" />
  <link rel="icon" type="image/x-icon" href="/favicon.ico" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />

  <!-- iOS & Android PWA Config -->
  <link rel="manifest" href="/manifest.json" />
  <meta name="theme-color" content="#3B5A3C" />
  <meta name="mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <meta name="apple-mobile-web-app-title" content="Jacaré do Corte" />
  <link rel="apple-touch-icon" href="/apple-touch-icon.png" />

  <title>Jacaré do Corte</title>
  <meta name="description" content="Agendamento online de cortes e barba na barbearia Jacaré do Corte com Painel do Dono integrado para gestão em tempo real." />
  <meta property="og:title" content="Jacaré do Corte" />
  <meta property="og:description" content="Agendamento online de cortes e barba na barbearia Jacaré do Corte com Painel do Dono integrado para gestão em tempo real." />

  <script>
    window.deferredInstallPrompt = null;
    window.addEventListener('beforeinstallprompt', (e) => {
      e.preventDefault();
      window.deferredInstallPrompt = e;
      window.dispatchEvent(new CustomEvent('pwa-prompt-available', { detail: e }));
    });

    if ('serviceWorker' in navigator) {
      window.addEventListener('load', () => {
        navigator.serviceWorker.register('/sw.js').catch((err) => {
          console.log('SW registration note:', err);
        });
      });
    }
  </script>
</head>

<body>
  <div id="root"></div>
  <script type="module" src="/src/main.tsx"></script>
</body>

</html>
